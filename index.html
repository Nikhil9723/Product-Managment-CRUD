<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./stylesheet/style.css">
    <title>Product managment system</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="navbar__header">
                Product managment System
            </div>
            <div class="navbar__searchbar-product">
                <div class="navbar__search-bar">
                    <input type="text" placeholder="Search For Your Product" id="searchbar" >
                    <button><img height="100%" width="100%" src="./svgs/search-logo.svg"></button>
                </div>
                <button class="edit-form-btn" id="add-product">Add Product</button>
            </div>
        </div>
    </header>
    <main>
        <div class="main-section">
            
            <div class="mainsection-edit-form" id="addProduct-form">

                <button id="cross-btn"><img height="40px" width="40px" src="./svgs/cross.svg" ></button>
                <span id="add-prod-title">Add Your Product</span>
                
                <form id="add-product-form" class="main-section__form--style">
                    <div class="product-all">
                        <label>Product Name</label>
                        <input type="text" id="product-name" class="input-style" required>
                    </div>
                    <div class="product-all">
                        <label>Product Price</label>
                        <input type="number" id="product-price" class="input-style" required>
                    </div>
                    <div class="product-all">
                        <label>Product Image URL</label>
                        <div class="product-img-style">
                            <input type="text" id="product-image" class="input-style">
                            <div id ="img-preview">
                                <!-- for preview image -->
                            </div>
                        </div>
                       
                    </div>
                    <div class="product-all">
                        <label>Product Description</label>
                        <input type="text" id="product-description" class="input-style" required>
                    </div>
                    <button type="submit" class="edit-form-btn">Add Product</button>
                </form>
            </div>
                
            <div class="main-section__product-list" id="Create-Product-details">
                <!-- Preview the product details here -->
                    </div>
                </div>
            </div>
         
        </div>

        <div class="mainsection-submit-form">
    
            <button id="close-submit-btn"><img height="40px" width="40px" src="./svgs/cross.svg" ></button>
            <span id="add-prod-title">Add Your Product</span>

            <form id="edit-product-form" class="main-section__form--style">
                <div class="product-all">
                    <label>Name</label>
                    <input type="text" id="edit-product-name" class="input-style">
                </div>
                <div class="product-all">
                    <label>Price</label>
                    <input type="text" id="edit-product-price" class="input-style">
                </div>
                <div class="product-all">
                    <label>Image</label>
                    <div id="product-image-style-edit">
                        <input type="text" id="edit-product-imgUrl" class="input-style">
                        <div id ="img-preview-edit">
                            <!-- for preview image -->
                        </div>
                    </div>
                    

                </div>
                <div class="product-all">
                    <label>Description</label>
                    <input type="text" id="edit-product-desc" class="input-style">
                </div>
                <!-- <button type="submit" class="">Edit</button> -->
                <button type="submit" class="edit-form-btn">Update Product</button>
            </form>
        </div>
        
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <script type="module" src="./Scripts/index.js"></script>

</body>
</html>
